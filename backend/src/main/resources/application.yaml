spring:
  application:
    name: mecatrack
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USER:mecatrack}
    password: ${DB_PASSWORD:mecatrack_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
